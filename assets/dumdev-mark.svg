  <path d="m46 65 21-11-10 21-3.4-7.1L46 65Z" fill="#F3FCFF" stroke="#E4FBFF" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M83 26v9M78.5 30.5h9M91 43v5M88.5 45.5h5" stroke="#DBFBFF" stroke-width="2.3" stroke-linecap="round"/>
  <circle cx="34" cy="89" r="2.2" fill="#79DFF5" opacity=".75"/>
