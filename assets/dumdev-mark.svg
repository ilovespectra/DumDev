<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">DumDev cloud mark</title>
  <desc id="desc">A glowing sky-blue cloud with a small writing spark.</desc>
  <defs>
    <linearGradient id="cloud" x1="20" y1="25" x2="94" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FE7FF"/>
      <stop offset=".52" stop-color="#66D8F0"/>
      <stop offset="1" stop-color="#B29AFF"/>
    </linearGradient>
    <linearGradient id="stroke" x1="20" y1="25" x2="100" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDFBFF"/>
      <stop offset=".58" stop-color="#7CE3F6"/>
      <stop offset="1" stop-color="#B9A6FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
